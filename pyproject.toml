# The Python environment for the flight planner (app.py) and the Census
# sampling (census_app.py, py/census). uv.lock pins every package to an exact
# version, so `uv sync --frozen` gives everyone the same environment and a
# published Census run can be reproduced exactly. See py/census/README.md.
#
# requirements.txt lists the same packages for pip users; keep the two in step.

[project]
name = "flight-planner"
version = "0.1.0"
description = "Drone flight planner, and the Census block-group sampling that picks where to fly"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.37.0",
    "pandas>=2.0.0,<3",       # the code is written for pandas 2
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "folium>=0.15.0",
    "streamlit-folium>=0.18.0",
    "branca>=0.7.0",
    "rasterio>=1.3.0",
    "pyproj>=3.0.0",
    "shapely>=2.0.0",
    "geopandas>=1.0.0",
    "requests>=2.31.0",
    "geopy>=2.4.1",
    "matplotlib>=3.7.0",
    "Pillow>=10.0.0",
    "openpyxl>=3.1.0",
    "comtypes>=1.2.0; sys_platform == 'win32'",
]

[project.scripts]
census = "census.__main__:main"     # `uv run census ...` = `python -m census ...` from py/

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py/census"]
